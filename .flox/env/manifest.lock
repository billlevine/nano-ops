{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.13.0",
    "install": {
      "python3": {
        "pkg-path": "python3"
      }
    },
    "vars": {
      "RESTART_BACKOFF_S": "5",
      "USAGE_REFRESH_S": "300"
    },
    "hook": {
      "on-activate": "  # Runtime state + the per-installation registry are gitignored\n  # (installation-specific, per the extraction plan). Create state/ so the\n  # services have somewhere to write, and seed loops.toml from the committed\n  # example if absent so dashboard-server reads a non-colliding port.\n  mkdir -p \"$FLOX_ENV_PROJECT/state\"\n  if [ ! -f \"$FLOX_ENV_PROJECT/loops.toml\" ]; then\n    cp \"$FLOX_ENV_PROJECT/loops.example.toml\" \"$FLOX_ENV_PROJECT/loops.toml\"\n  fi\n  # Render the static dashboard shell once (token-free, ~3s). The\n  # dashboard-refresh service then keeps state/dashboard.json fresh and the\n  # shell re-polls it in place. Guarded on the shell's existence (runs once)\n  # and best-effort so it never blocks or fails activation.\n  if [ ! -f \"$FLOX_ENV_PROJECT/state/dashboard.html\" ]; then\n    python3 \"$FLOX_ENV_PROJECT/bin/dashboard\" >/dev/null 2>&1 || true\n  fi\n"
    },
    "profile": {},
    "options": {},
    "services": {
      "dashboard-refresh": {
        "command": "  while true; do\n    bash \"$FLOX_ENV_PROJECT/bin/dashboard-refresh\" || true\n    echo \"dashboard-refresh: process exited — supervisor restart in ${RESTART_BACKOFF_S}s\" >&2\n    sleep \"${RESTART_BACKOFF_S}\"\n  done\n"
      },
      "dashboard-server": {
        "command": "  while true; do\n    python3 \"$FLOX_ENV_PROJECT/bin/dashboard-server\" || true\n    echo \"dashboard-server: process exited — supervisor restart in ${RESTART_BACKOFF_S}s\" >&2\n    sleep \"${RESTART_BACKOFF_S}\"\n  done\n"
      },
      "doorbell": {
        "command": "  while true; do\n    python3 \"$FLOX_ENV_PROJECT/bin/doorbell\" || true\n    echo \"doorbell: process exited — supervisor restart in ${RESTART_BACKOFF_S}s\" >&2\n    sleep \"${RESTART_BACKOFF_S}\"\n  done\n"
      },
      "usage-fetch": {
        "command": "  while true; do\n    python3 \"$FLOX_ENV_PROJECT/bin/usage-fetch\" || true\n    sleep \"${USAGE_REFRESH_S}\"\n  done\n"
      }
    }
  },
