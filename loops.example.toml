# loops.example.toml — committed sample registry for nano-ops.
#
# Per the extraction plan (2026-07-22 sharing/layering research), the real
# per-installation registry lives in `loops.toml`, which is gitignored
# (private-fork-only). Copy this file to loops.toml and edit for your install:
#
#     cp loops.example.toml loops.toml
#
# The Flox [hook] does this automatically on first `flox activate` if loops.toml
# is absent, so the bundled services have a config to read out of the box.
#
# Only the blocks the ported components actually read are shown. A real install
# adds a [loops.*] entry per loop (dir/skill/interval/autostart/persona/model);
# those, and the hub's real channel id, live in the private fork's loops.toml.

[hub]
# WHO THIS INSTALLATION'S HUB IS. The public core bakes in no operator identity
# — bin/doorbell, bin/dashboard and bin/ops all read it from here, so a fresh
# clone is anonymous until you name it.
#
# persona  display name. The agent-deck session title convention is
#          "<persona> (<loop name>)", and the hub's loop name is "hub", so
#          persona = "ops" means the hub session is titled "ops (hub)".
#          Override the whole title with session_title if you prefer.
# group    agent-deck group every hub-launched session lands in (the loop
#          sessions and the "ephemeral - <slug>" workers). Defaults to persona.
# estate   label for this estate, shown in the dashboard header.
# deck_profile  agent-deck profile to address. Pinned explicitly because a
#          service or cron context has a different ambient default profile and
#          would otherwise resolve titles against the wrong session store.
persona = "ops"
group = "ops"
estate = "ops"
deck_profile = "ops"
# session_title = "ops (hub)"

# Slack self-DM channel ID — read by bin/doorbell (the inbox poller). Also
# marks which inbox below is the PRIMARY one: it owns the bare state/hub/cursor
# and is where conservative inboxes escalate to.
# Left unset on purpose: with no slack_channel_id, no [[hub.inbox]] tables AND
# no state/secrets/slack-user-token in this repo, bin/doorbell exits cleanly on
# the missing-config path and does nothing. Safe by construction. Fill it in on
# a real install; the token is a file, never a value in this registry.
# slack_channel_id = "REPLACE_WITH_YOUR_SELF_DM_CHANNEL_ID"

# [[hub.inbox]] — the channels the hub watches. bin/doorbell polls each on its
# OWN poll_seconds, with its OWN cursor and its OWN kick cooldown, so a chatty
# channel never starves a quiet one. The hub tick re-reads them all.
#
# name          filename-safe label; also names the non-primary cursor file
#               (state/hub/cursor.<name>). The primary inbox keeps the bare
#               state/hub/cursor.
# channel_id    Slack channel/DM id.
# disposition   how much the hub may do on its own for this inbox:
#                 full-trust    act immediately on what arrives here.
#                 conservative  acknowledge, then escalate to the primary
#                               inbox and ask. Never act unilaterally.
#               Unstated defaults to "conservative" — unstated trust is never
#               full trust. Reserve full-trust for your own control channel.
# poll_seconds  per-inbox poll rate; defaults to 30.
#
# With no [[hub.inbox]] tables at all, slack_channel_id above still works on
# its own and is treated as a single full-trust inbox named "self-dm".
#
# [[hub.inbox]]
# name = "self-dm"
# channel_id = "REPLACE_WITH_YOUR_SELF_DM_CHANNEL_ID"
# disposition = "full-trust"
# poll_seconds = 30
#
# [[hub.inbox]]
# name = "team-handoff"
# channel_id = "REPLACE_WITH_ANOTHER_CHANNEL_ID"
# disposition = "conservative"
# poll_seconds = 60

[dashboard]
# bin/dashboard-server binds here; bin/dashboard links to it in its output.
# Port 8522 (not the operations default 8422) so this prototype can run
# ALONGSIDE a live operations dashboard-server on the same host without a
# bind conflict. Loopback only by design — Tier-1 local dashboard.
host = "127.0.0.1"
port = 8522

# [loops.<name>] — one block per loop this hub manages. No REAL loop ships in
# the public core (a loop is where installation policy concentrates, and the
# allowlist rule keeps policy out); this is the shape `bin/ops health`, the hub
# skill's health pass, and bin/dashboard all read.
#
# The one loop directory that does ship is loops/example/ — the copyable
# template (CLAUDE.md + skill) documenting the contract every loop owes the
# estate. Uncomment the block below to run the template itself as a cadence
# canary; copy the directory and rename it to build a real loop.
#
# [loops.example]
# dir = "loops/example"        # working directory, relative to the repo root
# skill = "example"            # skill name; the session runs /loop <interval> /<skill>
# interval = "20m"             # tick cadence; "on-demand" for a manual loop
# autostart = true             # include in the health sweep and autostart it
# persona = "the example"      # display name; session title is "<persona> (<name>)"
# model = "claude-sonnet-5"    # per-loop model, so cheap loops stay cheap
# role = "one line, shown on the dashboard card"

[usage]
# Cadence (seconds) for bin/usage-fetch, which populates state/usage/budget.json
# — the account %-of-limit signal bin/dashboard renders as the header "cap" line
# and a budget guard can gate on. 900s (15m) keeps it fresh enough while holding
# the authenticated /usage calls to ~96/day.
refresh_seconds = 900
