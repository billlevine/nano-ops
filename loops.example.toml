# loops.example.toml — committed sample registry for nano-ops.
#
# Per the extraction plan (2026-07-22 sharing/layering research), the real
# per-installation registry lives in `loops.toml`, which is gitignored
# (private-fork-only). Copy this file to loops.toml and edit for your install:
#
#     cp loops.example.toml loops.toml
#
# The Flox [hook] does this automatically on first `flox activate` if loops.toml
# is absent, so the bundled services have a config to read out of the box.
#
# Only the blocks the ported components actually read are shown. A real install
# adds a [loops.*] entry per loop (dir/skill/interval/autostart/persona/model);
# those, and the hub's real channel id, live in the private fork's loops.toml.

[hub]
# WHO THIS INSTALLATION'S HUB IS. The public core bakes in no operator identity
# — bin/doorbell, bin/dashboard and bin/ops all read it from here, so a fresh
# clone is anonymous until you name it.
#
# persona  display name. The agent-deck session title convention is
#          "<persona> (<loop name>)", and the hub's loop name is "hub", so
#          persona = "ops" means the hub session is titled "ops (hub)".
#          Override the whole title with session_title if you prefer.
# group    agent-deck group every hub-launched session lands in (the loop
#          sessions and the "ephemeral - <slug>" workers). Defaults to persona.
# estate   label for this estate, shown in the dashboard header.
# deck_profile  agent-deck profile to address. Pinned explicitly because a
#          service or cron context has a different ambient default profile and
#          would otherwise resolve titles against the wrong session store.
persona = "ops"
group = "ops"
estate = "ops"
deck_profile = "ops"
# session_title = "ops (hub)"

# Slack self-DM channel ID — read by bin/doorbell (the inbox poller). Also
# marks which inbox below is the PRIMARY one: it owns the bare state/hub/cursor
# and is where conservative inboxes escalate to.
# Left unset on purpose: with no slack_channel_id, no [[hub.inbox]] tables AND
# no state/secrets/slack-user-token in this repo, bin/doorbell exits cleanly on
# the missing-config path and does nothing. Safe by construction. Fill it in on
# a real install; the token is a file, never a value in this registry.
# slack_channel_id = "REPLACE_WITH_YOUR_SELF_DM_CHANNEL_ID"

# [[hub.inbox]] — the channels the hub watches. bin/doorbell polls each on its
# OWN poll_seconds, with its OWN cursor and its OWN kick cooldown, so a chatty
# channel never starves a quiet one. The hub tick re-reads them all.
#
# name          filename-safe label; also names the non-primary cursor file
#               (state/hub/cursor.<name>). The primary inbox keeps the bare
#               state/hub/cursor.
# channel_id    Slack channel/DM id.
# disposition   how much the hub may do on its own for this inbox:
#                 full-trust    act immediately on what arrives here.
#                 conservative  acknowledge, then escalate to the primary
#                               inbox and ask. Never act unilaterally.
#               Unstated defaults to "conservative" — unstated trust is never
#               full trust. Reserve full-trust for your own control channel.
# poll_seconds  per-inbox poll rate; defaults to 30.
#
# With no [[hub.inbox]] tables at all, slack_channel_id above still works on
# its own and is treated as a single full-trust inbox named "self-dm".
#
# [[hub.inbox]]
# name = "self-dm"
# channel_id = "REPLACE_WITH_YOUR_SELF_DM_CHANNEL_ID"
# disposition = "full-trust"
# poll_seconds = 30
#
# [[hub.inbox]]
# name = "team-handoff"
# channel_id = "REPLACE_WITH_ANOTHER_CHANNEL_ID"
# disposition = "conservative"
# poll_seconds = 60

# [hub.pane_watch] — the PANE SWEEP. bin/doorbell's second job, and the only
# deterministic reader of the live terminal here: hourly it captures each live
# session's pane tail, hashes it, and asks whether that pane has said anything
# since these exact bytes were FIRST seen. agent-deck's own status string cannot
# answer that — it reports `waiting` for a healthy between-ticks session and for
# a dead one alike — so a session can sit at an empty prompt for a day while
# every store-reading check calls it healthy.
#
# REPORT ONLY. Nothing is kicked, restarted or filed: an idle prompt is a
# legitimate resting state, so a flag is a signal for a person, never a trigger.
# `bin/doorbell panes --report` answers "what is flagged now" out of the last
# sweep's file without looking again, and refuses to speak for the present when
# that file is older than two sweep intervals.
#
# All keys are optional; the values below are the defaults the code uses with no
# table at all.
#
# sweep_seconds  how often the daemon looks (minimum 60).
# idle_seconds   how long an unchanged pane may sit before it is flagged.
# capture_lines  how much of the pane tail is hashed (1..2000).
#
# [hub.pane_watch]
# sweep_seconds = 3600
# idle_seconds = 3600
# capture_lines = 50
#
# [hub.pane_watch.overrides] — per-session thresholds, in seconds. Different
# session CLASSES want different ones: an ephemeral worker quiet for an hour is
# a stall, and a long-lived session with no cadence at all is doing what it is
# for. 0 means never flag. A key matches a title exactly, or as a substring when
# no exact key matches (longest key wins), so "ephemeral - " sets a class.
#
# [hub.pane_watch.overrides]
# "ops (advisor)" = 0
# "ephemeral - " = 1800

[dashboard]
# bin/dashboard-server binds here; bin/dashboard links to it in its output.
# Port 8522 (not the 8422 default) so this can run ALONGSIDE another estate's
# dashboard-server on the same host without a bind conflict. Loopback only by
# design — Tier-1 local dashboard.
host = "127.0.0.1"
port = 8522

# Header labels for the rendered pages. Both are optional and both fall back to
# the [hub] identity above ([hub].estate and [hub].persona), so an install that
# named itself once up there does not have to name itself again.
# estate_name = "ops"
# operator_name = "ops"

# Who a proposal decision made through the dashboard is recorded AS. A decision
# arrives from a browser with no identity of its own, so this is the
# installation's own name for whoever holds the write token — a TECHNICAL actor
# name, never a persona. Unset, decisions are recorded as "owner".
# decision_actor = "owner"

# [loops.<name>] — one block per loop this hub manages. This is the shape
# `bin/ops health`, the hub skill's health pass, and bin/dashboard all read.
#
# A loop is where installation policy concentrates, so almost no loop ships in
# the public core — the allowlist rule keeps policy out. Two directories are
# here regardless, and both are mechanism rather than anyone's policy:
#
#   loops/example/   the copyable template (CLAUDE.md + skill) documenting the
#                    contract every loop owes the estate. Copy the directory
#                    and rename it to build a real loop.
#   loops/mechanic/  the nightly diagnose-and-propose pass. It reads only what
#                    an installation already writes — this registry, the
#                    ledger, the policy files, the session list — and names no
#                    operator, loop, repo or channel. Every estate needs one to
#                    build itself out.
#
# The example block below is commented out — it is a template, and running the
# template itself is a deliberate choice. The mechanic block is NOT: an estate
# needs its mechanic from the first day it has anything to diagnose, and a core
# loop that every install has to discover and uncomment is a core loop nobody
# runs. `autostart = true` costs nothing until you run `bin/ops up` — nothing
# here starts a loop at activation time.
#
# [loops.example]
# dir = "loops/example"        # working directory, relative to the repo root
# skill = "example"            # skill name; the session runs /loop <interval> /<skill>
# interval = "20m"             # tick cadence; "on-demand" for a manual loop
# autostart = true             # include in the health sweep and autostart it
# persona = "the example"      # display name; session title is "<persona> (<name>)"
# model = "claude-sonnet-5"    # per-loop model, so cheap loops stay cheap
# role = "one line, shown on the dashboard card"
# recovery = "stop-start"      # optional: how `bin/ops health` re-arms this loop
#                              # when it is alive. Default is a plain kick
#                              # (`session send "/loop …"`); a kick into a live
#                              # session arms a SECOND schedule, so set this on
#                              # a loop you have seen tick at a multiple of its
#                              # cadence. Its engine may also append one epoch
#                              # line per tick to state/<name>/tick-log, which
#                              # is what lets health judge the tick RATE at all.

[loops.mechanic]
dir = "loops/mechanic"
skill = "mechanic"
interval = "20m"             # heartbeat cadence; the PASS runs once a night
autostart = true
persona = "the mechanic"
model = "claude-sonnet-5"
role = "nightly self-optimization pass — diagnoses and proposes, never operates"

# The mechanic's nightly window is NOT set here — it lives in
# state/mechanic/config.toml (pass_start/pass_end, local HH:MM), written with
# defaults on first run. An empty pass_start disables the pass and leaves a
# heartbeat-only loop; that is the switch to use if you want the mechanic
# registered and healthy but not spending anything yet.

[usage]
# Cadence (seconds) for bin/usage-fetch, which populates state/usage/budget.json
# — the account %-of-limit signal bin/dashboard renders as the header "cap" line
# and a budget guard can gate on. 900s (15m) keeps it fresh enough while holding
# the authenticated /usage calls to ~96/day.
refresh_seconds = 900

# [extraction] — only meaningful in a PRIVATE FORK of this core, where it turns
# on the mechanic's EXTRACTION lens: the pass that spots mechanism sitting in
# your fork that belongs upstream in the public core. Commented out because a
# fresh clone IS the core and has nothing to extract into.
#
# `repo` enables the lens — the value is never opened or resolved, only tested
# for non-emptiness, so a typo leaves you a lens that looks healthy and compares
# nothing. `allowlist` is optional and resolves against THIS repo (the fork),
# not the core. docs/extraction-allowlist.example.md is the template to copy and
# the spec for the format the lens parses.
#
# [extraction]
# repo = "~/src/nano-ops"
# allowlist = "docs/extraction-allowlist.md"

# Optional dashboard headings expanded by default in the digest:
# priority_headings = ["Needs attention"]  # under [dashboard]
# For a loop whose non-tick verbs also update last_tick, add to its loop table:
# tick_health = "log"
# Hub model choice is optional in [hub]; no model is pinned by bin/ops.
